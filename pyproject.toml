[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ahaMargin-linux"
version = "1.2.0"
description = "A MarginNote style PDF marker for Linux: capture passages into a margin note column."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT; bundled assistant components: PolyForm Noncommercial 1.0.0" }
authors = [{ name = "ahaMargin-linux contributors" }]
keywords = ["pdf", "annotation", "highlight", "notes", "ahamargin", "qt", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "PySide6-Essentials>=6.5",
    "PyMuPDF>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.gui-scripts]
ahaMargin-linux = "ahamargin.app:main"

[project.urls]
Homepage = "https://github.com/chengmingbo/ahaMargin-linux"
Issues = "https://github.com/chengmingbo/ahaMargin-linux/issues"

[tool.setuptools.packages.find]
include = ["ahamargin*"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
ahamargin = ["vendor/heehawpdf/*.js", "vendor/heehawpdf/*.sh", "vendor/heehawpdf/LICENSE.md"]
